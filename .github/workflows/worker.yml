name: Deploy read-mode Worker

# Deploys worker/ to Cloudflare when it changes on main. Needs two repo secrets
# (Settings -> Secrets and variables -> Actions): CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Without them the job runs the tests and stops.
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker.yml]
  pull_request:
    paths: [worker/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy
        if: github.ref == 'refs/heads/main' && env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Secrets missing
        if: github.ref == 'refs/heads/main' && env.CF_TOKEN == ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; tests passed, skipping deploy. See README."
