name: Check feeds

# Runs the step-1 feed health test whenever the panel or ingest code changes,
# and on demand. Prints per-outlet item counts to the job log.
on:
  push:
    paths:
      - panel.yaml
      - ingest/**
      - scripts/check_feeds.py
      - requirements.txt
      - .github/workflows/check-feeds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every source (incl. fallbacks)
        run: python scripts/check_feeds.py --all
      - name: Chosen source per outlet
        run: python scripts/check_feeds.py
