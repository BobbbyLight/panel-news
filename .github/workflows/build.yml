name: Build & deploy

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the :00 rush
  workflow_dispatch:       # also fired by the app's pull-to-refresh
  push:
    branches: [main, "claude/**"]
    paths:
      - panel.yaml
      - ingest/**
      - web/**
      - scripts/show_clusters.py
      - requirements*.txt
      - .github/workflows/build.yml

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two builds at once (the second would read a stale pool.json).
concurrency:
  group: build-pages
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - run: pip install -r requirements-build.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch, cluster, write JSON
        run: python -m ingest.build --out _site --prev "${{ steps.pages.outputs.base_url }}"

      - name: Add static app
        run: cp -r web/. _site/

      - name: Top clusters
        run: python scripts/show_clusters.py _site/stories.json --top 25

      - name: Threshold sweep (non-main only, for tuning)
        if: github.ref != 'refs/heads/main'
        run: python scripts/show_clusters.py _site/pool.json --sweep 0.35,0.40,0.45,0.50,0.55

      - name: Upload preview artifact (non-main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 3

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
