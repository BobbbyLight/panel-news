<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.workers.dev https://api.github.com; base-uri 'none'; form-action 'none'">
<title>Panel News</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to stories</a>
  <header class="top">
    <h1 class="brand"><a href="#/">Panel<span>News</span></a></h1>
    <p id="status" class="status" aria-live="polite"></p>
    <div class="top-actions">
      <button id="view-btn" type="button" class="icon-btn" aria-label="Change list view"><span aria-hidden="true">▦</span></button>
      <button id="refresh-btn" type="button" class="icon-btn" aria-label="Refresh"><span aria-hidden="true">↻</span></button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a class="tab" data-tab="today" href="#/"><span class="tab-ico" aria-hidden="true">◉</span>Today</a>
    <a class="tab" data-tab="more" href="#/more"><span class="tab-ico" aria-hidden="true">☰</span>More</a>
    <a class="tab" data-tab="blind" href="#/blind"><span class="tab-ico" aria-hidden="true">◐</span>Blindspots</a>
    <a class="tab" data-tab="settings" href="#/settings"><span class="tab-ico" aria-hidden="true">⚙</span>Settings</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
